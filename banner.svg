<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Retro BIOS boot screen: Adam Gazdiev, System &amp; Software Engineer">
<style>
text { font-family: 'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
.l { opacity: 0; animation: show .05s linear forwards; }
.f { opacity: 0; animation: show .05s linear forwards, hide .05s linear forwards; }
.cur { opacity: 0; animation: show .05s linear forwards, blink 1.06s steps(1) infinite; }
@keyframes show { to { opacity: 1; } }
@keyframes hide { to { opacity: 0; } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .l, .cur { opacity: 0; animation: none; opacity: 1; }
  .f { display: none; }
}
</style>
